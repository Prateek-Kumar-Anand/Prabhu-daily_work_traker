name: Build APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # packages: '' skips this action's own package install/license flow,
      # which is what was failing ("6 of 7 SDK package licenses not
      # accepted") - we accept licenses and install packages ourselves
      # below instead, where it's fully non-interactive.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Accept SDK licenses and install build packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      # v5, not v6: v6 moves caching behind Gradle's own commercial Terms of
      # Use. v5 is still MIT-licensed and already runs on Node 24.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # --no-daemon: a lingering daemon in the ephemeral CI VM holds file
      # locks in ~/.gradle that intermittently break the post-build cache
      # save step ("Failed to save cache entry" / EBADF errors). Skipping
      # the daemon avoids that whole class of noise; it's also pointless
      # overhead on a one-shot runner anyway.
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: daily-tracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
